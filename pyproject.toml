[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "question-answering-claim-audit"
version = "0.1.0"
description = "Offline audit of documented answer-finding capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Project contributors"}]
dependencies = []

[project.scripts]
question-answering-claim-audit = "question_answering_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["question_answering_claim_audit*"]
